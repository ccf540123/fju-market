<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="/login.css">
    <title>登入｜WAYFLOO</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo">WAYFLOO</a>
        </div>
    </header>

    <main class="auth-page">
        <a href="/" class="back-link">← 返回首頁</a>

        <h1 class="auth-title">WAYFLOO</h1>
        <p class="subtitle">校園二手交易平台，目前提供輔大學生使用</p>

        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-mode="login">登入</button>
                <button type="button" class="auth-tab" data-mode="register">註冊</button>
            </div>

            <form id="auth-form" class="auth-form" novalidate>
                <label for="email">學校信箱</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="學號@cloud.fju.edu.tw"
                    autocomplete="email"
                    required
                >

                <label for="password">密碼</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="至少 8 個字元"
                        autocomplete="current-password"
                        minlength="8"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                        aria-label="顯示密碼"
                        title="顯示密碼"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <div id="confirm-password-group" class="hidden">
                    <label for="confirm-password">確認密碼</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="再次輸入密碼"
                            autocomplete="new-password"
                            minlength="8"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm-password"
                            aria-label="顯示密碼"
                            title="顯示密碼"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <p id="form-message" class="form-message" aria-live="polite"></p>

                <button type="submit" class="box auth-submit">登入</button>
                <button type="button" id="forgot-password-btn" class="forgot-link">忘記密碼？</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/login.js"></script>
</body>
</html>
