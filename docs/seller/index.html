<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="/profile.css?v=2">
    <title>個人頁面｜WAYFLOO</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/home/" class="logo">WAYFLOO</a>
        </div>
    </header>

    <main class="auth-page profile-layout">
        <a id="back-link" href="/home/" class="back-link">← 返回商品</a>
        <p id="seller-status" class="subtitle">載入中...</p>
        <div id="seller-card" class="auth-card hidden">
            <h1 id="seller-heading" class="auth-title"></h1>
            <img id="seller-avatar" class="avatar-preview" alt="賣家頭像">
            <p class="seller-field"><span>姓名</span> <strong id="seller-name"></strong></p>
            <p class="seller-field"><span>科系</span> <strong id="seller-department"></strong></p>
        </div>

        <section id="seller-products" class="profile-products hidden">
            <h2 class="profile-products-title">發布的商品</h2>
            <p id="products-empty" class="profile-products-empty">載入中...</p>
            <div id="product-list" class="product-grid"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/seller.js?v=2"></script>
</body>
</html>
