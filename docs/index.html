<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="/landing.css?v=6">
    <title>WAYFLOO</title>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo">WAYFLOO</a>
        </div>
    </header>

    <main class="landing-page">
        <h1 class="landing-title">WAYFLOO</h1>
        <p class="subtitle">校園二手交易平台，目前提供輔大學生使用</p>

        <div class="container">
            <a href="/login/" class="box">註冊/登入</a>
            <a href="/home/" class="box">開始逛逛</a>
        </div>

        <section class="feature-list">
            <article class="feature-card">
                <div class="feature-icon">🔍</div>
                <h3>搜尋課本、生活用品、3C 等</h3>
                <p>輕鬆找到你需要的二手物品</p>
            </article>
            <article class="feature-card">
                <div class="feature-icon">📦</div>
                <h3>出售閒置物品</h3>
                <p>用幾分鐘把不需要的東西放上來</p>
            </article>
            <article class="feature-card">
                <div class="feature-icon">🏫</div>
                <h3>校園交易</h3>
                <p>和校園裡的同學買賣二手物品</p>
            </article>
        </section>

        <section class="feedback-section">
            <h2 class="feedback-title">給我一些回饋</h2>
            <p class="feedback-text">網站目前還在測試中，用過之後如果有什麼想法、遇到什麼問題，或是想看到什麼功能，都可以跟我說！</p>
            <a
                class="feedback-btn"
                href="https://forms.gle/Bt8ziPwA1pkoFEcF7"
                target="_blank"
                rel="noopener noreferrer"
            >
                填寫回饋表單
            </a>
        </section>
    </main>

    <footer class="site-footer">
        WAYFLOO · 非官方學生平台
    </footer>
</body>
</html>
