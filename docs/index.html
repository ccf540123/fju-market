<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="/landing.css?v=7">
    <title>WAYFLOO</title>
</head>

<body>
    <main class="landing-page">
        <section class="landing-hero">
            <p class="landing-slogan">校園裡的二手交易</p>
            <h1 class="landing-logo">WAYFLOO</h1>

            <div class="landing-art" aria-hidden="true">
                <svg viewBox="0 0 200 160" fill="none">
                    <rect x="28" y="78" width="144" height="62" rx="4" stroke="#111" stroke-width="2.2"/>
                    <path d="M28 96h144" stroke="#111" stroke-width="2.2"/>
                    <circle cx="58" cy="117" r="7" stroke="#111" stroke-width="2.2"/>
                    <circle cx="142" cy="117" r="7" stroke="#111" stroke-width="2.2"/>
                    <rect x="70" y="38" width="60" height="48" rx="4" stroke="#111" stroke-width="2.2"/>
                    <path d="M82 38v-8h36v8" stroke="#111" stroke-width="2.2"/>
                    <path d="M88 58h24" stroke="#777" stroke-width="2"/>
                    <path d="M88 68h16" stroke="#777" stroke-width="2"/>
                </svg>
            </div>

            <p class="landing-hook">同學都賣什麼？</p>

            <div class="landing-actions">
                <a href="/home/" class="box">開始逛逛</a>
                <a href="/login/?mode=register" class="box landing-primary">免費加入</a>
                <p class="landing-login-line">
                    已有帳號？<a href="/login/">登入</a>
                </p>
            </div>
        </section>

        <section class="feature-list">
            <article class="feature-card">
                <div class="feature-icon">🔍</div>
                <h3>搜尋課本、生活用品、3C 等</h3>
                <p>輕鬆找到你需要的二手物品</p>
            </article>
            <article class="feature-card">
                <div class="feature-icon">📦</div>
                <h3>出售閒置物品</h3>
                <p>用幾分鐘把不需要的東西放上來</p>
            </article>
            <article class="feature-card">
                <div class="feature-icon">🏫</div>
                <h3>校園交易</h3>
                <p>和校園裡的同學買賣二手物品</p>
            </article>
        </section>

        <section class="feedback-section">
            <h2 class="feedback-title">給我一些回饋</h2>
            <p class="feedback-text">網站目前還在測試中，用過之後如果有什麼想法、遇到什麼問題，或是想看到什麼功能，都可以跟我說！</p>
            <a
                class="feedback-btn"
                href="https://forms.gle/Bt8ziPwA1pkoFEcF7"
                target="_blank"
                rel="noopener noreferrer"
            >
                填寫回饋表單
            </a>
        </section>
    </main>

    <footer class="site-footer">
        WAYFLOO · 非官方學生平台
    </footer>
</body>
</html>
