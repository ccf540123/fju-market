<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WAYFLOO — 校園裡的二手交易。下載 iOS / Android App，在同學之間安心買賣。">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Syne:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/landing.css?v=10">
    <title>WAYFLOO｜校園裡的二手交易</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo" aria-label="WAYFLOO 首頁">
                <span class="brand-mark brand-mark--nav" aria-hidden="true">
                    <span class="brand-text">WAYFL</span>
                    <span class="brand-eye"></span>
                    <span class="brand-eye"></span>
                </span>
            </a>
            <a href="#download" class="header-cta">下載 App</a>
        </div>
    </header>

    <main>
        <section class="hero" aria-label="WAYFLOO 介紹">
            <div class="hero-media" aria-hidden="true">
                <img
                    class="hero-image"
                    src="/landing-cover.png"
                    alt=""
                    width="640"
                    height="640"
                >
            </div>
            <div class="hero-copy">
                <p class="hero-kicker reveal">校園裡的二手交易</p>
                <h1 class="hero-brand reveal reveal-delay-1">
                    <span class="brand-mark brand-mark--hero" aria-label="WAYFLOO">
                        <span class="brand-text">WAYFL</span>
                        <span class="brand-eye"></span>
                        <span class="brand-eye"></span>
                    </span>
                </h1>
                <p class="hero-lead reveal reveal-delay-2">專為學生打造的二手交易 App。在校園裡買賣課本、生活用品與 3C。</p>
                <div class="hero-actions reveal reveal-delay-3">
                    <a class="store-btn store-btn--ios" href="#download" data-store="ios">
                        <span class="store-btn-label">App Store</span>
                        <span class="store-btn-sub" data-store-sub="ios">下載 iOS 版</span>
                    </a>
                    <a class="store-btn store-btn--android" href="#download" data-store="android">
                        <span class="store-btn-label">Google Play</span>
                        <span class="store-btn-sub" data-store-sub="android">下載 Android 版</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="intro" id="about">
            <h2 class="intro-title">為什麼是 WAYFLOO</h2>
            <p class="intro-text">把閒置留給同學，也從同學手上找到需要的東西。交易發生在校園裡，距離近、溝通快、更安心。</p>
        </section>

        <section class="download" id="download">
            <h2 class="download-title">下載 WAYFLOO</h2>
            <p class="download-text">選擇你的裝置，開始在校園裡買賣二手物品。</p>
            <div class="download-actions">
                <a class="store-btn store-btn--ios" href="#download" data-store="ios">
                    <span class="store-btn-label">App Store</span>
                    <span class="store-btn-sub" data-store-sub="ios">下載 iOS 版</span>
                </a>
                <a class="store-btn store-btn--android" href="#download" data-store="android">
                    <span class="store-btn-label">Google Play</span>
                    <span class="store-btn-sub" data-store-sub="android">下載 Android 版</span>
                </a>
            </div>
            <p class="download-note" id="download-note" hidden>商店連結準備中，敬請期待。</p>
        </section>
    </main>

    <footer class="site-footer">
        <p class="footer-brand">WAYFLOO</p>
        <p class="footer-meta">校園裡的二手交易</p>
    </footer>

    <script src="/landing.js?v=10"></script>
</body>
</html>
