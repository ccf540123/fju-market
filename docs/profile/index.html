<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="/profile.css?v=3">
    <title>我的頁面｜WAYFLOO</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/home/" class="logo">WAYFLOO</a>
        </div>
    </header>

    <main class="auth-page profile-layout">
        <a href="/home/" class="back-link">← 返回商品列表</a>

        <h1 class="auth-title">我的頁面</h1>
        <p class="subtitle">更新姓名、科系與頭像，下方是你發布的商品</p>

        <div class="auth-card">
            <img id="avatar-preview" class="avatar-preview" alt="頭像預覽">

            <form id="profile-form" class="auth-form">
                <label for="display-name">姓名</label>
                <input type="text" id="display-name" name="display_name" required>

                <label for="department">科系</label>
                <input type="text" id="department" name="department" placeholder="例如：資訊工程學系">

                <label for="avatar-file">頭像</label>
                <input type="file" id="avatar-file" name="avatar" accept="image/*">
                <p class="form-hint">可從相簿選擇，或直接拍照</p>

                <p id="profile-message" class="form-message"></p>

                <button type="submit" class="box auth-submit">儲存</button>
            </form>
            <button type="button" id="logout-btn" class="profile-logout">登出</button>
        </div>

        <section class="profile-products">
            <h2 class="profile-products-title">我的商品</h2>
            <p id="products-empty" class="profile-products-empty">載入中...</p>
            <div id="product-list" class="product-grid"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/profile.js?v=3"></script>
</body>
</html>
