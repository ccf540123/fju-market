<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="/home.css?v=21">
    <title>編輯商品｜WAYFLOO</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/home/" class="logo">WAYFLOO</a>
        </div>
    </header>

    <main class="auth-page">
        <a href="/my-products/" class="back-link">← 返回管理商品</a>
        <p id="edit-status" class="subtitle">載入中...</p>

        <form id="edit-form" class="publish-form edit-form hidden">
            <h1 class="auth-title">編輯商品</h1>
            <p id="school-hint" class="form-hint"></p>

            <label for="product-title">商品名稱</label>
            <input type="text" id="product-title" required>

            <label for="product-price">價格</label>
            <input type="number" id="product-price" min="0" required>

            <label for="product-parent-category">主分類</label>
            <select id="product-parent-category"></select>

            <label for="product-subcategory">子分類（選填）</label>
            <select id="product-subcategory"></select>

            <label for="product-description">商品說明</label>
            <textarea id="product-description" rows="5"></textarea>

            <span class="form-label-text">商品圖片</span>
            <img id="image-preview" class="image-preview hidden" alt="商品預覽">
            <label class="file-picker" for="product-image">
                <input type="file" id="product-image" class="file-picker-input" accept="image/*">
                <span class="file-picker-btn">更換照片</span>
                <span id="product-image-name" class="file-picker-name">使用目前照片</span>
            </label>

            <label class="anon-check">
                <input type="checkbox" id="product-anonymous">
                匿名刊登
            </label>

            <p id="edit-message" class="form-message"></p>
            <button type="submit" id="save-btn" class="box auth-submit">儲存</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/schools.js?v=20"></script>
    <script src="/edit-product.js?v=21"></script>
</body>
</html>
