<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="stylesheet" href="/product.css?v=2">
    <link rel="stylesheet" href="/chat.css?v=3">
    <title>聊天｜WAYFLOO</title>
</head>
<body class="chat-body">
    <div id="chat-shell" class="chat-shell">
        <header class="chat-header">
            <a href="/messages/" class="chat-back" aria-label="返回訊息列表">←</a>
            <img
                id="chat-avatar"
                class="chat-header-avatar"
                alt=""
                src="https://placehold.co/48x48/f0f0f0/666666?text=頭像"
            >
            <div class="chat-header-text">
                <h1 id="chat-peer-name" class="chat-peer-name">聊天</h1>
                <p id="chat-product" class="chat-product"></p>
            </div>
        </header>

        <p id="chat-status" class="chat-status">載入中...</p>

        <div id="chat-box" class="chat-box hidden">
            <div id="message-list" class="message-list"></div>
            <form id="chat-form" class="chat-form">
                <textarea
                    id="message-input"
                    rows="1"
                    placeholder="輸入訊息..."
                    autocomplete="off"
                ></textarea>
                <button type="submit">送出</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/unread.js?v=1"></script>
    <script src="/chat.js?v=3"></script>
</body>
</html>
