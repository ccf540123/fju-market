<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/product.css?v=2">
    <link rel="stylesheet" href="/chat.css">
    <title>聊天｜WAYFLOO</title>
</head>
<body>
    <a href="/messages/" class="product-back-btn" aria-label="返回訊息列表">←</a>

    <main class="product-page product-page--list chat-page">
        <h1 id="chat-title" class="list-title">聊天</h1>
        <p class="list-hint">有新回覆時，記得再回來訊息查看</p>
        <p id="chat-status" class="product-status">載入中...</p>

        <div id="chat-box" class="chat-box hidden">
            <div id="message-list" class="message-list"></div>
            <form id="chat-form" class="chat-form">
                <input
                    type="text"
                    id="message-input"
                    placeholder="輸入訊息..."
                    autocomplete="off"
                    required
                >
                <button type="submit">送出</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/unread.js?v=1"></script>
    <script src="/chat.js?v=2"></script>
</body>
</html>
