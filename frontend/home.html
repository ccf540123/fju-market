<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>商品瀏覽｜輔大二手交易平台</title>
</head>
<body>
    <!-- 上方導覽列：Logo + 搜尋 -->
    <header class="site-header">
        <div class="header-inner">
            <a href="landing.html" class="logo">輔大二手市集</a>

            <nav class="header-nav">
                <a href="home.html">全部商品</a>
                <a href="#">我的收藏</a>
                <a href="login.html">登入</a>
            </nav>

            <div class="header-search">
                <input
                    type="search"
                    id="search-input"
                    placeholder="搜尋商品"
                >
            </div>
        </div>
    </header>

    <div class="page-layout">
        <!-- 左側分類篩選 -->
        <aside class="sidebar">
            <h2 class="sidebar-title">商品分類</h2>
            <ul class="category-list" id="category-list">
                <li>
                    <button type="button" class="category-btn active" data-category="all">全部商品</button>
                </li>
                <li>
                    <button type="button" class="category-btn" data-category="books">書籍</button>
                </li>
                <li>
                    <button type="button" class="category-btn" data-category="electronics">3C 電子</button>
                </li>
                <li>
                    <button type="button" class="category-btn" data-category="daily">生活用品</button>
                </li>
                <li>
                    <button type="button" class="category-btn" data-category="clothing">服飾</button>
                </li>
                <li>
                    <button type="button" class="category-btn" data-category="others">其他</button>
                </li>
            </ul>
        </aside>

        <!-- 右側商品區 -->
        <main class="main-content">
            <!-- 相關分類標籤 -->
            <section class="related-tags" id="related-tags">
                <button type="button" class="tag-btn active" data-category="all">全部商品</button>
                <button type="button" class="tag-btn" data-category="books">書籍</button>
                <button type="button" class="tag-btn" data-category="electronics">3C 電子</button>
                <button type="button" class="tag-btn" data-category="daily">生活用品</button>
                <button type="button" class="tag-btn" data-category="clothing">服飾</button>
                <button type="button" class="tag-btn" data-category="others">其他</button>
            </section>

            <!-- 商品列表標題列 -->
            <div class="list-header">
                <div class="list-header-left">
                    <h1 class="list-title">分類商品</h1>
                    <p class="list-count">共 <span id="product-count">0</span> 件商品</p>
                </div>
                <label class="sort-label">
                    排序
                    <select id="sort-select">
                        <option value="newest">最新上架</option>
                        <option value="price-asc">價格由低到高</option>
                        <option value="price-desc">價格由高到低</option>
                    </select>
                </label>
            </div>

            <!-- 商品卡片網格 -->
            <div id="product-list" class="product-grid"></div>
            <p id="empty-message" class="empty-message hidden">找不到符合的商品</p>
        </main>
    </div>

    <!-- 發布商品按鈕 -->
    <button type="button" id="publish-btn" class="publish-btn">＋ 發布商品</button>

    <script src="home.js" defer></script>
</body>
</html>
