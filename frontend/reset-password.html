<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="landing.css">
    <link rel="stylesheet" href="login.css">
    <title>重設密碼｜輔大二手交易平台</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="landing.html" class="logo">輔大二手市集</a>
        </div>
    </header>

    <main class="auth-page">
        <a href="login.html" class="back-link">← 返回登入</a>
        <h1 class="auth-title">重設密碼</h1>
        <p class="subtitle">請輸入新密碼</p>

        <div class="auth-card">
            <form id="reset-form" class="auth-form">
                <label for="new-password">新密碼</label>
                <input
                    type="password"
                    id="new-password"
                    minlength="8"
                    required
                    placeholder="至少 8 個字元"
                >

                <label for="confirm-password">確認新密碼</label>
                <input
                    type="password"
                    id="confirm-password"
                    minlength="8"
                    required
                    placeholder="再次輸入新密碼"
                >

                <p id="form-message" class="form-message"></p>
                <button type="submit" class="box auth-submit">更新密碼</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
