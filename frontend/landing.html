<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="landing.css">
    <title>輔大二手交易平台</title>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="landing.html" class="logo">輔大二手市集</a>
            <nav class="header-nav">
                <a href="home.html">全部商品</a>
                <a href="login.html">登入</a>
            </nav>
        </div>
    </header>

    <main class="landing-page">
        <h1 class="landing-title">輔大二手交易平台</h1>
        <p class="subtitle">校園二手市集，安全、方便、只限輔大學生</p>

        <div class="container">
            <button class="box" data-action="login">註冊/登入</button>
            <button class="box" data-action="verify">學校信箱驗證</button>
            <button class="box" data-action="about">About us</button>

            <div class="product-section">
                <div class="category-wrapper">
                    <h3>熱門分類</h3>
                    <div class="category-container">
                        <div data-text="" style="--r:-15;" class="category-glass">
                            <img src="assets/eat.jpg" alt="商品圖片">
                        </div>
                        <div data-text="" style="--r:5;" class="category-glass">
                            <img src="assets/my123.jpg" alt="商品圖片">
                        </div>
                        <div data-text="" style="--r:25;" class="category-glass">
                            <img src="assets/S__18161682.jpg" alt="商品圖片">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="landing.js" defer></script>
</body>
</html>
