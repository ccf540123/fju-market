<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="landing.css">
    <title>輔大二手交易平台</title>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="landing.html" class="logo">輔大二手市集</a>
        </div>
    </header>

    <main class="landing-page">
        <h1 class="landing-title">輔大二手交易平台</h1>
        <p class="subtitle">校園二手市集，安全、方便、只限輔大學生</p>

        <div class="container">
            <a href="login.html" class="box">註冊/登入</a>
            <a href="home.html" class="box">開始逛逛</a>
        </div>

        <section class="feature-list">
            <article class="feature-card">
                <h3>搜尋課本、生活用品、3C 等</h3>
                <p>輕鬆找到你需要的二手物品</p>
            </article>
            <article class="feature-card">
                <h3>出售閒置物品</h3>
                <p>用幾分鐘把不需要的東西放上來</p>
            </article>
            <article class="feature-card">
                <h3>校園交易</h3>
                <p>和校園裡的同學買賣二手物品</p>
            </article>
        </section>

        <section class="feedback-section">
            <h2 class="feedback-title">給我一些回饋</h2>
            <p class="feedback-text">網站目前還在測試中，用過之後如果有什麼想法、遇到什麼問題，或是想看到什麼功能，都可以跟我說！</p>
            <!-- 把下面的網址換成你的 Google 表單連結 -->
            <a
                class="feedback-btn"
                href="https://forms.gle/Bt8ziPwA1pkoFEcF7"
                target="_blank"
                rel="noopener noreferrer"
            >
                填寫回饋表單
            </a>
        </section>
    </main>

    <footer>
        FJU Market · 非官方學生平台
    </footer>
</body>
</html>
